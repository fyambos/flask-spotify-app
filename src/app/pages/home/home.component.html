<h1 class="page-title">Spotify Organizer &amp; Music Downloader</h1>
<p class="page-subtitle">Sync with Spotify.</p>

<div class="mt-8 grid gap-3 sm:grid-cols-2">
  <a *ngFor="let f of features" [routerLink]="f.path"
     class="card group flex items-start gap-4 p-5 transition hover:ring-zinc-300">
    <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-zinc-100 text-zinc-600">
      <lucide-icon [name]="f.icon" [size]="18"></lucide-icon>
    </span>
    <div class="min-w-0 flex-1">
      <div class="font-medium">{{ f.title }}</div>
      <p class="mt-0.5 text-sm text-zinc-500">{{ f.text }}</p>
    </div>
    <span class="mt-1 inline-flex text-zinc-300 transition group-hover:text-zinc-500"><lucide-icon name="arrow-right" [size]="16"></lucide-icon></span>
  </a>
</div>
